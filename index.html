:root {
  --bg: #111111;
  --surface: #181713;
  --surface-2: #211e17;
  --gold: #d4af37;
  --gold-light: #fde68a;
  --text: #fffaf0;
  --muted: #c9c1ac;
  --line: rgba(212, 175, 55, .28);
  --danger: #ff8a86;
  --success: #a7e8b4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#111111;
    --surface:#181713;
    --surface-2:#211e17;
  }
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
  background: #111;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Tahoma, "Segoe UI", sans-serif;
  overflow-x: clip;
}
button, input, a {
  font-family: inherit;
}
a {
  color: inherit;
}
button {
  cursor: pointer;
}
.app-shell {
  min-height: 100vh;
  padding-top: var(--safe-area-inset-top);
  background: radial-gradient(circle at 88% 5%, rgba(212,175,55,.18), transparent 29%), radial-gradient(circle at 8% 32%, rgba(212,175,55,.09), transparent 27%), var(--bg);
  overflow-x: clip;
}
.topbar {
  position: sticky;
  top: var(--safe-area-inset-top);
  z-index: 20;
  background: rgba(17,17,17,.92);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
}
.nav {
  max-width: 1220px;
  margin: auto;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: .2px;
  text-decoration: none;
}
.logo-mark {
  color: var(--gold);
  font-size: 30px;
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 28px;
  font-size: 15px;
}
.nav-links a {
  text-decoration: none;
  color: #e8e1cf;
}
.nav-links a:hover {
  color: var(--gold-light);
}
.nav-download {
  padding: 9px 17px;
  border: 1px solid var(--gold);
  border-radius: 999px;
  color: var(--gold-light) !important;
  font-weight: 700;
}
.hero {
  max-width: 1220px;
  margin: auto;
  padding: 70px 24px 50px;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1.18fr .82fr;
  gap: 52px;
  align-items: center;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--gold-light);
  border: 1px solid var(--line);
  background: rgba(212,175,55,.08);
  padding: 8px 13px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 0 5px rgba(212,175,55,.15);
}
.hero h1 {
  font-size: clamp(62px, 8vw, 108px);
  line-height: .95;
  margin: 23px 0 14px;
  letter-spacing: -2px;
}
.subtitle {
  max-width: 650px;
  font-size: clamp(18px, 2.2vw, 26px);
  line-height: 1.75;
  color: #efe8d7;
  margin: 0;
}
.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin: 26px 0 29px;
}
.badges span {
  border: 1px solid #39362d;
  background: #1a1915;
  border-radius: 999px;
  padding: 8px 13px;
  color: #ddd5bd;
  font-size: 13px;
}
.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
}
.gold-btn, .whatsapp-btn, .gate-download, .cta-band a {
  min-height: 52px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-decoration: none;
  border-radius: 12px;
  font-weight: 800;
  font-size: 16px;
  padding: 14px 20px;
}
.gold-btn {
  background: linear-gradient(135deg, #f6d768, #d4af37 55%, #9d7f1f);
  color: #191700;
  box-shadow: 0 14px 35px rgba(212,175,55,.22);
}
.gold-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 42px rgba(212,175,55,.3);
}
.whatsapp-btn {
  border: 1px solid #4d554a;
  color: #fff;
  background: #1c231d;
}
.hero-proof {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 24px;
  color: var(--muted);
  font-size: 14px;
}
.hero-proof svg {
  color: var(--gold);
}
.hero-visual {
  border: 1px solid var(--line);
  border-radius: 22px;
  overflow: hidden;
  background: linear-gradient(145deg, #252117, #151310);
  box-shadow: 0 28px 70px rgba(0,0,0,.45);
}
.visual-head {
  padding: 20px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #3c372a;
  font-size: 14px;
}
.live {
  color: #a7e8b4;
}
.visual-rows {
  padding: 18px;
  display: grid;
  gap: 10px;
}
.visual-rows > div {
  display: grid;
  grid-template-columns: 30px 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 14px;
  border: 1px solid #373227;
  border-radius: 12px;
  background: #1a1813;
}
.visual-rows svg {
  color: var(--gold);
}
.visual-rows span:last-child {
  color: var(--muted);
  font-size: 12px;
}
.visual-footer {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 18px 22px;
  color: var(--muted);
  font-size: 13px;
}
.visual-footer strong {
  color: var(--gold-light);
}
.version-line {
  height: 1px;
  flex: 1;
  background: var(--line);
}
.scroll-hint {
  display: flex;
  align-items: center;
  gap: 8px;
  width: -moz-max-content;
  width: max-content;
  margin-top: 45px;
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
}
.section {
  max-width: 1220px;
  margin: auto;
  padding: 68px 24px;
}
.section-head {
  max-width: 760px;
  margin: 0 auto 38px;
  text-align: center;
}
.section-head h2, .cta-band h2 {
  font-size: clamp(31px, 4vw, 48px);
  margin: 10px 0;
  line-height: 1.25;
}
.section-head p {
  color: var(--muted);
  line-height: 1.8;
  margin: 0;
}
.kicker {
  color: var(--gold-light);
  font-weight: 800;
  font-size: 14px;
}
.download-section {
  padding-top: 35px;
}
.gate-layout {
  display: grid;
  grid-template-columns: 1.25fr .75fr;
  gap: 22px;
  align-items: stretch;
}
.gate-card {
  background: #1a1813;
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 30px;
  box-shadow: 0 24px 60px rgba(0,0,0,.3);
}
.gate-title {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 25px;
}
.gate-title h3 {
  margin: 0 0 4px;
  font-size: 23px;
}
.gate-title p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}
.gate-icon {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  background: rgba(212,175,55,.12);
  color: var(--gold-light);
  border-radius: 13px;
  flex: 0 0 auto;
}
.gate-card > label {
  display: block;
  margin-bottom: 9px;
  font-weight: 700;
}
.code-row {
  display: flex;
  gap: 10px;
}
.code-row input {
  min-width: 0;
  flex: 1;
  min-height: 52px;
  border: 1px solid #4a4435;
  border-radius: 11px;
  background: #111;
  color: #fff;
  padding: 0 15px;
  font-size: 16px;
  outline: none;
  direction: ltr;
  text-align: left;
}
.code-row input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212,175,55,.16);
}
.copy-btn, .confirm-btn {
  min-height: 52px;
  border-radius: 11px;
  font-weight: 800;
}
.copy-btn {
  border: 1px solid #4a4435;
  background: #24211a;
  color: #fff;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.confirm-btn {
  width: 100%;
  margin-top: 12px;
  background: var(--gold);
  color: #1a1700;
  border: 0;
  font-size: 16px;
}
.status-area {
  min-height: 50px;
  margin: 16px 0 10px;
}
.msg {
  margin: 0;
  padding: 12px 13px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  line-height: 1.5;
}
.msg.error {
  color: var(--danger);
  background: rgba(255,138,134,.08);
}
.msg.success {
  color: var(--success);
  background: rgba(167,232,180,.08);
}
.msg.muted {
  color: var(--muted);
  background: rgba(255,255,255,.03);
}
.gate-download {
  width: 100%;
  background: #353124;
  color: #aaa393;
  cursor: not-allowed;
}
.gate-download.active {
  background: linear-gradient(135deg, #f6d768, #d4af37 55%, #9d7f1f);
  color: #191700;
  cursor: pointer;
  box-shadow: 0 12px 28px rgba(212,175,55,.2);
}
.direct-link {
  display: block;
  text-align: center;
  margin-top: 15px;
  color: var(--gold-light);
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 5px;
  min-height: 44px;
  line-height: 44px;
}
.gate-side {
  border: 1px solid #2f2c23;
  border-radius: 22px;
  padding: 30px;
  background: linear-gradient(180deg, #211d15, #171511);
}
.gate-side h3 {
  margin: 0 0 10px;
  font-size: 22px;
}
.gate-side > p {
  color: var(--muted);
  line-height: 1.8;
}
.gate-side ul {
  list-style: none;
  padding: 0;
  margin: 25px 0;
  display: grid;
  gap: 13px;
}
.gate-side li {
  display: flex;
  gap: 9px;
  align-items: center;
}
.gate-side li svg {
  color: var(--gold);
}
.mini-card {
  display: flex;
  align-items: center;
  gap: 13px;
  border-top: 1px solid #383324;
  padding-top: 22px;
}
.mini-card svg {
  color: var(--gold);
}
.mini-card div {
  display: grid;
  gap: 3px;
}
.mini-card span {
  color: var(--muted);
  font-size: 13px;
}
.features-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.feature-card {
  background: #1a1813;
  border: 1px solid #2d2a21;
  border-radius: 18px;
  padding: 28px;
  transition: .2s;
}
.feature-card:hover {
  border-color: var(--line);
  transform: translateY(-3px);
}
.feature-icon {
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: rgba(212,175,55,.12);
  color: var(--gold-light);
  border: 1px solid var(--line);
  margin-bottom: 18px;
}
.feature-card h3 {
  margin: 0 0 9px;
  font-size: 20px;
}
.feature-card p {
  margin: 0;
  color: var(--muted);
  line-height: 1.75;
}
.pricing {
  border-top: 1px solid #2a271f;
  border-bottom: 1px solid #2a271f;
  background: #0f0e0b;
}
.pricing-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
}
.price-card {
  position: relative;
  text-align: center;
  padding: 31px 16px 25px;
  border: 1px solid #2f2b21;
  border-radius: 18px;
  background: #1a1813;
}
.price-card.popular {
  border-color: var(--gold);
  background: #241f13;
  transform: translateY(-8px);
  box-shadow: 0 18px 40px rgba(212,175,55,.12);
}
.popular-tag {
  position: absolute;
  top: -13px;
  right: 50%;
  transform: translateX(50%);
  background: var(--gold);
  color: #1a1700;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}
.price-card h3 {
  margin: 0;
  font-size: 19px;
  color: #e7dfc9;
}
.price {
  font-size: 28px;
  font-weight: 800;
  color: var(--gold-light);
  margin: 17px 0 7px;
}
.price-card > p {
  color: var(--muted);
  margin: 0;
  font-size: 13px;
}
.lifetime {
  display: inline-block;
  margin-top: 17px;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(212,175,55,.1);
  color: var(--gold-light);
  font-size: 12px;
}
.pricing-note {
  text-align: center;
  color: var(--muted);
  margin: 27px 0 0;
}
.steps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  list-style: none;
  padding: 0;
  margin: 0;
  counter-reset: step;
}
.steps li {
  background: #1a1813;
  border: 1px solid #2d2a21;
  border-radius: 18px;
  padding: 28px;
}
.step-num {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--gold);
  color: #1a1700;
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 17px;
}
.steps h3 {
  margin: 0 0 8px;
}
.steps p {
  margin: 0;
  color: var(--muted);
  line-height: 1.8;
}
.steps code {
  color: var(--gold-light);
  background: #111;
  padding: 3px 6px;
  border-radius: 5px;
  font-size: 13px;
}
.cta-band {
  max-width: 1172px;
  margin: 0 auto 72px;
  padding: 34px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: linear-gradient(120deg, rgba(212,175,55,.17), rgba(212,175,55,.03) 55%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
.cta-band h2 {
  margin: 0 0 7px;
  font-size: clamp(26px, 3vw, 36px);
}
.cta-band p {
  margin: 0;
  color: var(--muted);
}
.cta-band a {
  background: var(--gold);
  color: #1a1700;
  white-space: nowrap;
}
footer {
  border-top: 1px solid #2c291f;
  background: #0c0b09;
}
.footer-inner {
  max-width: 1220px;
  margin: auto;
  padding: 28px 24px 34px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
}
.footer-inner p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}
.footer-inner p a {
  color: var(--gold-light);
}
.footer-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  font-weight: 800;
  font-size: 19px;
}
.footer-logo span {
  color: var(--gold);
  font-size: 25px;
}
.windows-note {
  border: 1px solid #3b3628;
  border-radius: 999px;
  padding: 7px 12px;
  color: #d8cfb6;
  font-size: 13px;
}
@media (max-width: 900px) {
  .hero-grid {
    grid-template-columns: 1fr;
    gap: 34px;
  }
  .gate-layout {
    grid-template-columns: 1fr;
  }
  .features-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .pricing-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 22px 14px;
  }
  .price-card.popular {
    transform: none;
  }
  .steps {
    grid-template-columns: 1fr;
  }
  .cta-band {
    flex-direction: column;
    align-items: stretch;
    text-align: center;
  }
  .cta-band a {
    width: 100%;
  }
}
@media (max-width: 560px) {
  .nav {
    padding: 14px 16px;
  }
  .nav-links {
    gap: 13px;
    font-size: 13px;
  }
  .nav-links a:nth-child(3) {
    display: none;
  }
  .logo {
    font-size: 19px;
  }
  .logo-mark {
    font-size: 24px;
  }
  .hero {
    padding: 46px 16px 38px;
  }
  .hero h1 {
    font-size: 62px;
  }
  .subtitle {
    font-size: 18px;
    line-height: 1.7;
  }
  .hero-actions {
    flex-direction: column;
  }
  .gold-btn, .whatsapp-btn {
    width: 100%;
  }
  .hero-visual {
    order: 2;
  }
  .visual-rows > div {
    grid-template-columns: 28px 1fr;
  }
  .visual-rows span:last-child {
    grid-column: 2;
  }
  .section {
    padding: 54px 16px;
  }
  .gate-card, .gate-side {
    padding: 22px 18px;
  }
  .code-row {
    flex-direction: column;
  }
  .copy-btn {
    justify-content: center;
  }
  .features-grid {
    grid-template-columns: 1fr;
  }
  .pricing-grid {
    grid-template-columns: 1fr;
  }
  .popular-tag {
    top: -13px;
  }
  .cta-band {
    margin: 0 16px 54px;
    padding: 28px 20px;
  }
  .footer-inner {
    justify-content: center;
    text-align: center;
    padding: 26px 16px 32px;
  }
  .scroll-hint {
    margin-top: 34px;
  }
}
</style>
